[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-decisions"
version = "0.1.0"
description = "Typed Jev decisions with a deterministic safety boundary"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Jev Decisions contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = [
    "__init__",
    "cockpit",
    "fabric",
    "gateway",
    "ingest",
    "jev_case",
    "jev_cockpit",
    "jev_gateway",
    "ledger",
    "runtime",
    "shadow_report",
]

[project.scripts]
jev-gateway = "jev_gateway:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

