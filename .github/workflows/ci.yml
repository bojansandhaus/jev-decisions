name: Jev Decisions checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Test native approval policy regressions
        run: python -m unittest discover -s integrations/approval-provider/tests -p 'test_policy_regression.py' -v

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Scan public files
        run: python tools/public_scan.py

      - name: Install public package
        run: python -m pip install .

      - name: Smoke test installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'import closed_loop, gateway; assert gateway.verify({})["verified"] is False'
          printf '%s\n' '{"changed":true,"read_back":true,"evidence":true}' | jev-gateway verify
